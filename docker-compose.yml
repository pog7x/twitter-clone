version: "3.8"

services:
  frontend:
    build: frontend/
    volumes:
      - ./frontend:/frontend
    ports:
      - 3000:3000
    user: 1000:1000

  backend:
    build: backend/
    ports:
      - 8080:8080
    links:
      - pg
    depends_on:
      pg:
        condition: service_healthy

  pg:
    image: postgres:12
    environment:
      - POSTGRES_DB=twitter_clone
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d twitter_clone" ]
      interval: 5s
      timeout: 5s
      retries: 5
