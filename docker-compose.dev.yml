version: "3.8"

services:
  frontend_dev:
    build:
      context: frontend
      dockerfile: Dockerfile.dev
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8080
      - HOST=0.0.0.0
      - PORT=3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  backend_dev:
    build:
      context: backend
      dockerfile: Dockerfile.dev
    environment:
      - DEBUG=true
      - LOG_LEVEL=info

      - HOST=0.0.0.0
      - PORT=8080

      - DATABASE_URL=postgresql://pg:5432/twitter_clone?user=user&password=password

      - UPLOADS_DIR_PATH=/uploads/

      - SESSION_EXPIRED_AT=24h

      - ENCODED_SESSION_HASH_KEY=wbuNF/yrhZ6JDZw3yX7YZOMT+sk+z+xYf+IRmYJE2oMPgXlmlbYjexo5VKLGbVkZAYdnxxgdP5uu0jgNjPzAfA==
      - ENCODED_SESSION_BLOCK_KEY=OW655QMHxqFIrEMzPtI5Y8ZLpskzdEevudwyLmE/lOg=

      - JWT_SECRET_KEY=secret
    volumes:
      - ./backend:/backend
      - ./backend/uploads:/uploads
    ports:
      - "8080:8080"
    links:
      - pg
    depends_on:
      pg:
        condition: service_healthy

  pg:
    image: postgres:12
    environment:
      - POSTGRES_DB=twitter_clone
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d twitter_clone" ]
      interval: 5s
      timeout: 5s
      retries: 5
